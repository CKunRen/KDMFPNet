[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdmfpnet"
version = "0.1.0"
description = "Knowledge-distilled multi-fidelity point-cloud network for surface Cp prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.1",
]

[tool.setuptools]
package-dir = {"" = "kdmfpnet"}

[tool.setuptools.packages.find]
where = ["kdmfpnet"]
